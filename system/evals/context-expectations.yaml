    authority_expectation: The task contract determines authority; project-specific canonical pages determine project state.
    freshness_expectation: Task and project state are high-freshness and require current source inspection.
    expected_unknowns:
      - Which specific project page governs a project not named in the query.
      - Whether compatibility project state remains under live/projects/.

  - question_id: CTX-AIS-004
    required_sources:
      - ref: system/brain-mind-bridge.md
        kind: exact-path
        reason: Canonical bridge defines approval semantics and Mind ownership.
      - ref: system/approved-write-pilot.md
        kind: exact-path
        reason: Pilot defines the only validated synthetic write scope and explicit exclusions.
      - ref: system/runbooks/review-approved-mind-write.md
        kind: exact-path
        reason: Human review checklist defines mandatory approval and stop conditions.
    acceptable_alternatives:
      - ref: system/infinite-brain-philosophy.md
        kind: exact-path
        reason: Philosophy supplies enduring human-authority principles.
    forbidden_sources:
      - ref: inbox/processed/
