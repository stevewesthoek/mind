        reason: User manual summarizes canonical intake routes but is subordinate to the contracts.
    forbidden_sources:
      - ref: capture/
        kind: path-prefix
        reason: Legacy capture paths are historical or compatibility surfaces, not active defaults.
    authority_expectation: Folder contract governs Mind paths; Brain evidence is required only for live routing verification.
    freshness_expectation: Intake routing is high-freshness and must retain dated verification evidence.
    expected_unknowns:
      - Whether any external integration has changed since the last verified routing evidence.

  - question_id: CTX-AIS-003
    required_sources:
      - ref: system/task-kanban-contract.md
        kind: exact-path
        reason: Canonical contract establishes kanban.md as sole human task authority.
      - ref: projects/README.md
        kind: exact-path
        reason: Canonical project-area policy defines where active project state belongs.
    acceptable_alternatives:
      - ref: kanban.md
        kind: exact-path
        reason: Human task board supplies current task state after authority is established by the contract.
    forbidden_sources:
      - ref: tasks.md
        kind: exact-path
        reason: Retired non-authoritative snapshot must not supply current task state.
      - ref: live/tasks.md
        kind: exact-path
