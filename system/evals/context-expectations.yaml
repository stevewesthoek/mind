    required_sources:
      - ref: system/folder-contract.md
        kind: exact-path
        reason: Canonical folder contract defines active and retired path roles.
      - ref: system/brain-mind-bridge.md
        kind: exact-path
        reason: Bridge records verified live intake targets and exchange surfaces.
    acceptable_alternatives:
      - ref: home.md
