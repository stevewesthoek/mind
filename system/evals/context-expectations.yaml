        kind: path-prefix
        reason: Real person records must not be exposed for a redacted synthetic onboarding case.
    authority_expectation: Use only synthetic project-scoped material and preserve least disclosure for the redacted person.
    freshness_expectation: Onboarding context must reflect current project state and access scope.
    expected_unknowns:
      - Role, permissions, prerequisites, current architecture, and first tasks.

  - question_id: CTX-PRJ-005
    required_sources:
      - ref: missing:projects/synthetic-project/success-criteria
        kind: intentionally-missing
        reason: No production success-criteria or deadline authority exists for the synthetic project.
    acceptable_alternatives: []
    forbidden_sources:
      - ref: kanban.md
        kind: exact-path
        reason: Task dates cannot create project-level success criteria or deadlines.
    authority_expectation: Require an explicit project charter or human decision.
    freshness_expectation: Success criteria may be durable; deadlines require current confirmation.
    expected_unknowns:
      - Success metrics, acceptance authority, deadline, and change history.

  - question_id: CTX-AIS-001
    required_sources:
      - ref: system/brain-mind-bridge.md
        kind: exact-path
        reason: Canonical human policy defines Brain and Mind ownership and proposal boundaries.
      - ref: system/approved-write-pilot.md
        kind: exact-path
        reason: Validated pilot defines the currently proven narrow write class and exclusions.
    acceptable_alternatives:
      - ref: system/runbooks/review-approved-mind-write.md
        kind: exact-path
        reason: Review runbook supplies execution stop conditions and verification requirements.
    forbidden_sources:
      - ref: system/reports/
        kind: path-prefix
        reason: Dated reports are evidence and cannot independently broaden write authority.
    authority_expectation: Human policy and exact approved scope govern; Brain runtime evidence cannot expand Mind authority.
    freshness_expectation: Automation boundaries require current policy plus separately verified Brain capability state.
    expected_unknowns:
      - Whether Brain has completed its own end-to-end B5.4 pilot.
      - Whether any production write class has been separately approved.

