version: "1.0"
corpus: context-expectations
expectations:
  - question_id: CTX-PER-001
    required_sources:
      - ref: wiki/areas/personal-identity/profile.md
        kind: exact-path
        reason: Canonical personal identity profile contains durable mission and goal statements.
    acceptable_alternatives:
      - ref: wiki/areas/personal-identity/
        kind: path-prefix
        reason: Scoped personal-identity authority may supply supporting context without overriding the profile.
    forbidden_sources:
      - ref: inbox/new/
        kind: path-prefix
        reason: Unreviewed captures cannot establish current personal goals.
    authority_expectation: Prefer the scoped personal-identity authority; surface conflicts with newer human decisions for review.
    freshness_expectation: Treat durable goals as current unless explicitly superseded; flag absent review dates rather than inventing recency.
    expected_unknowns:
      - Whether any newer private decision has changed the documented goals.

  - question_id: CTX-PER-002
    required_sources:
      - ref: wiki/areas/personal-identity/profile.md
        kind: exact-path
        reason: Canonical profile defines values, boundaries, and decision rules.
      - ref: wiki/areas/personal-identity/theology.md
        kind: exact-path
        reason: Canonical theology file defines faith convictions that shape decisions.
    acceptable_alternatives:
      - ref: system/infinite-brain-philosophy.md
        kind: exact-path
        reason: System philosophy may support how values govern the Mind system but cannot replace personal authority.
    forbidden_sources:
      - ref: system/reports/
        kind: path-prefix
        reason: Generated reports are evidence, not personal-value authority.
    authority_expectation: Explicit personal identity and theology documents outrank generated summaries and raw captures.
    freshness_expectation: Stable convictions remain usable without automatic expiry; contradictory newer human decisions must be surfaced.
    expected_unknowns:
      - Whether any conviction has changed since the last human review.

  - question_id: CTX-PER-003
    required_sources:
      - ref: missing:current-personal-development-register
        kind: intentionally-missing
        reason: No verified canonical register of current personal development areas exists.
    acceptable_alternatives:
      - ref: wiki/areas/personal-identity/profile.md
        kind: exact-path
        reason: The profile supplies durable constraints and preferences but not a current development plan.
    forbidden_sources:
      - ref: inbox/new/
        kind: path-prefix
        reason: Raw reflections cannot be promoted into current development commitments.
    authority_expectation: Return insufficient evidence unless a human identifies a current authoritative development record.
    freshness_expectation: Current development work requires recent explicit review; durable profile material is only background.
    expected_unknowns:
      - Which development areas are actively pursued now.
      - Their priority, owner, and review date.

  - question_id: CTX-PER-004
    required_sources:
      - ref: missing:reviewed-personal-reflection-index
        kind: intentionally-missing
        reason: No reviewed canonical index of recurring personal reflection themes exists.
    acceptable_alternatives:
      - ref: wiki/areas/personal-identity/
        kind: path-prefix
        reason: Canonical identity documents may provide stable themes but not recurrence evidence.
    forbidden_sources:
      - ref: inbox/new/
        kind: path-prefix
        reason: Unreviewed captures may contain private material and cannot establish recurring patterns.
      - ref: history/
        kind: path-prefix
        reason: Historical material cannot establish current recurring challenges without review.
    authority_expectation: Require human review before inferring a personal pattern from multiple notes.
    freshness_expectation: Pattern claims require a dated reviewed synthesis; absent one, report the gap.
    expected_unknowns:
      - Which reflections are in scope for pattern analysis.
      - Whether any apparent pattern is current or historical.

  - question_id: CTX-PER-005
    required_sources:
      - ref: missing:current-work-life-boundary-decision
        kind: human-review-required
        reason: Existing files contain constraints but no verified current decision record for time allocation.
    acceptable_alternatives:
      - ref: wiki/areas/personal-identity/profile.md
        kind: exact-path
        reason: Profile constraints may frame the answer without proving a current allocation decision.
      - ref: knowledge/decisions.md
        kind: exact-path
        reason: Canonical decisions register may contain relevant approved decisions if later updated.
    forbidden_sources:
      - ref: kanban.md
        kind: exact-path
        reason: Task state alone cannot establish personal work-life policy.
    authority_expectation: A specific human decision is required; task volume or inferred behavior must not become policy.
    freshness_expectation: Require a current reviewed decision because time-allocation policy changes materially.
    expected_unknowns:
      - Current allocation targets and boundaries.
      - Whether business and personal scopes may be combined for this answer.

  - question_id: CTX-PRO-001
    required_sources:
      - ref: wiki/organisations/prochat/brand/product-strategy.md
        kind: exact-path
        reason: Registered compatibility-authoritative source for current ProChat product strategy.
      - ref: wiki/organisations/prochat/brand/company-principles.md
        kind: exact-path
        reason: Highest-level company philosophy constrains product strategy.
    acceptable_alternatives:
      - ref: wiki/organisations/prochat/brand/README.md
        kind: exact-path
        reason: Canonical brand index identifies scoped authorities and current product hierarchy.
    forbidden_sources:
      - ref: wiki/organisations/prochat/brand/archive/
        kind: path-prefix
        reason: Archived brand material cannot override current strategy.
    authority_expectation: Company principles govern product strategy; the canonical product strategy governs current product direction.
    freshness_expectation: Apply high-risk strategy review dates and surface review-needed status after the documented review window.
    expected_unknowns:
      - Whether a newer explicit human decision exists outside the current canonical strategy.

  - question_id: CTX-PRO-002
    required_sources:
      - ref: wiki/organisations/prochat/brand/customer-profiles.md
        kind: exact-path
        reason: Canonical customer-profile authority defines current primary users and future buyers.
      - ref: wiki/organisations/prochat/brand/product-strategy.md
        kind: exact-path
        reason: Canonical strategy defines the current product promise and boundaries.
    acceptable_alternatives:
      - ref: wiki/organisations/prochat/brand/go-to-market.md
        kind: exact-path
        reason: Interim go-to-market direction supports the customer and value proposition.
    forbidden_sources:
      - ref: inbox/new/
        kind: path-prefix
        reason: Unreviewed market captures cannot redefine the target customer.
    authority_expectation: Canonical customer and strategy documents outrank research, captures, and public-copy derivatives.
    freshness_expectation: Customer and value-proposition claims require current strategy review; stale documents remain cited as review-needed.
    expected_unknowns:
      - Whether beta evidence has changed the target customer since the last review.

  - question_id: CTX-PRO-003
    required_sources:
      - ref: wiki/organisations/prochat/brand/product-roadmap.md
        kind: exact-path
        reason: Canonical product roadmap governs current development priorities and stage gates.
    acceptable_alternatives:
      - ref: wiki/organisations/prochat/brand/README.md
        kind: exact-path
        reason: Brand index provides current-stage orientation but not complete priority detail.
    forbidden_sources:
      - ref: kanban.md
        kind: exact-path
        reason: Mind task authority may show work items but cannot replace the scoped ProChat product roadmap.
      - ref: system/reports/
        kind: path-prefix
        reason: Generated reports cannot redefine product priorities.
    authority_expectation: The scoped product roadmap governs product priorities; task state may only support execution status.
    freshness_expectation: Treat active priorities as high-freshness and flag the roadmap if its review date is absent or stale.
    expected_unknowns:
      - Which roadmap item is actively staffed today.
      - Whether Brain or external repo execution has changed implementation status.

  - question_id: CTX-PRO-004
    required_sources:
      - ref: wiki/organisations/prochat/brand/go-to-market.md
        kind: exact-path
        reason: Canonical interim direction explicitly states pricing and packaging are not final.
      - ref: wiki/organisations/prochat/brand/product-roadmap.md
        kind: exact-path
        reason: Product roadmap defines the future licensing and monetization decision gates.
    acceptable_alternatives:
      - ref: wiki/organisations/prochat/brand/customer-profiles.md
        kind: exact-path
        reason: Future buyer context may support packaging considerations without establishing decisions.
    forbidden_sources:
      - ref: inbox/new/
        kind: path-prefix
        reason: Unreviewed pricing ideas cannot be represented as decisions.
    authority_expectation: Report only explicit canonical decisions; absence of finalized pricing is an authoritative unknown.
    freshness_expectation: Pricing and packaging require current explicit review before reliance.
    expected_unknowns:
      - Final prices, package boundaries, and licensing terms.
      - Date and authority of any future commercial decision.

  - question_id: CTX-PRO-005
    required_sources:
      - ref: wiki/organisations/prochat/brand/public-platform-strategy.md
        kind: exact-path
        reason: Canonical public-platform strategy governs company positioning and page responsibilities.
      - ref: wiki/organisations/prochat/brand/canonical-homepage-copy.md
        kind: exact-path
        reason: Approved public homepage narrative governs current public claims.
    acceptable_alternatives:
      - ref: wiki/organisations/prochat/brand/company-principles.md
        kind: exact-path
        reason: Company philosophy constrains public positioning.
    forbidden_sources:
      - ref: wiki/organisations/prochat/brand/archive/
        kind: path-prefix
        reason: Archived copy and strategy cannot represent current public positioning.
    authority_expectation: Public-platform strategy and approved copy govern public positioning within company-principle boundaries.
    freshness_expectation: Use approved dates and reconcile public copy when higher-level strategy changes.
    expected_unknowns:
      - Whether the deployed public website currently matches the approved copy.

  - question_id: CTX-YES-001
    required_sources:
      - ref: organizations/yeshua-academy/overview.md
        kind: exact-path
        reason: Canonical organization overview under organizations/, the target path for durable organization knowledge per system/folder-contract.md. Contains mission, educational focus, audience, and positioning.
    acceptable_alternatives:
      - ref: organizations/yeshua-academy/
        kind: path-prefix
        reason: Organization folder may contain additional supporting context without overriding the overview.
    forbidden_sources:
      - ref: history/
        kind: path-prefix
        reason: Historical material cannot establish the academy's current mission.
    authority_expectation: Use organizations/yeshua-academy/overview.md as the current canonical mission authority; surface the missing owner and review date as review-needed; do not supersede this source unless a newer human-approved authority is identified.
    freshness_expectation: overview.md carries no owner or review-date metadata; treat content as review-needed until an explicit review date is added.
    expected_unknowns:
      - Approval owner and review date for overview.md.
      - Whether a newer human-approved organization authority supersedes the current overview.

  - question_id: CTX-YES-002
    required_sources:
      - ref: missing:yeshua-academy-active-curriculum-register
        kind: intentionally-missing
        reason: No verified canonical register of active curriculum or courses exists in Mind.
    acceptable_alternatives: []
    forbidden_sources:
      - ref: inbox/new/
        kind: path-prefix
        reason: Raw ideas cannot establish active curriculum work.
    authority_expectation: Do not infer active curriculum from captures or unrelated finance repositories.
    freshness_expectation: Active curriculum requires a recently reviewed roadmap or project register.
    expected_unknowns:
      - Active curriculum areas, course owners, progress, and deadlines.

  - question_id: CTX-YES-003
    required_sources:
      - ref: missing:yeshua-academy-pedagogy-authority
        kind: intentionally-missing
        reason: No verified canonical educational-philosophy document exists in Mind.
    acceptable_alternatives:
      - ref: faith/README.md
        kind: exact-path
        reason: Faith area policy establishes domain placement only, not academy pedagogy.
    forbidden_sources:
      - ref: faith/resources/
        kind: path-prefix
        reason: Raw faith resources cannot define organizational pedagogy.
    authority_expectation: Require a human-designated academy policy; general faith principles cannot be promoted into pedagogy.
    freshness_expectation: Pedagogy may be durable but still requires explicit approval and review metadata.
    expected_unknowns:
      - Teaching model, curriculum principles, and approved pedagogical boundaries.

  - question_id: CTX-YES-004
    required_sources:
      - ref: missing:yeshua-academy-audience-enrollment-decision
        kind: human-review-required
        reason: No verified current decision identifies audience or enrollment scope.
    acceptable_alternatives: []
    forbidden_sources:
      - ref: inbox/new/
        kind: path-prefix
        reason: Unreviewed audience ideas cannot become enrollment policy.
    authority_expectation: Only an explicit organizational or human decision can establish audience and enrollment scope.
    freshness_expectation: Enrollment policy is high-freshness and must be reviewed before use.
    expected_unknowns:
      - Intended audience, eligibility, geography, capacity, and current enrollment state.

  - question_id: CTX-YES-005
    required_sources:
      - ref: missing:yeshua-academy-prochat-relationship-decision
        kind: human-review-required
        reason: No verified cross-organization strategy decision exists in Mind.
    acceptable_alternatives:
      - ref: wiki/organisations/prochat/brand/product-strategy.md
        kind: exact-path
        reason: ProChat strategy can establish its own scope but not Yeshua Academy's relationship to it.
    forbidden_sources:
      - ref: system/reports/
        kind: path-prefix
        reason: Generated planning evidence cannot create cross-organization strategy authority.
    authority_expectation: Require explicit human authority covering both organizations; one-sided strategy cannot decide the relationship.
    freshness_expectation: Cross-organization strategy requires a current dated decision.
    expected_unknowns:
      - Whether a formal relationship exists and its product, ministry, legal, and operational boundaries.

  - question_id: CTX-FAI-001
    required_sources:
      - ref: wiki/areas/personal-identity/theology.md
        kind: exact-path
        reason: Canonical personal theology states the current relationship between faith, grace, and works.
    acceptable_alternatives:
      - ref: faith/theology/
        kind: path-prefix
        reason: Reviewed theological synthesis may support or qualify the personal position.
    forbidden_sources:
      - ref: faith/resources/theology/
        kind: path-prefix
        reason: Exploratory resources cannot override settled personal theology.
    authority_expectation: Personal theological authority governs the user's current position; supporting synthesis must be clearly distinguished.
    freshness_expectation: Stable conviction remains current unless explicitly superseded; debated nuances must remain labeled.
    expected_unknowns:
      - Whether a newer reviewed theological synthesis adds qualifications.

  - question_id: CTX-FAI-002
    required_sources:
      - ref: missing:reviewed-resurrection-apologetics-register
        kind: intentionally-missing
        reason: No verified canonical index identifies which resurrection resources or arguments were personally reviewed.
    acceptable_alternatives:
      - ref: faith/resources/apologetics/
        kind: path-prefix
        reason: Raw apologetics resources may show available evidence but not reviewed conclusions.
      - ref: faith/apologetics/
        kind: path-prefix
        reason: Any future reviewed apologetics synthesis would be authoritative within this scope.
    forbidden_sources:
      - ref: inbox/new/
        kind: path-prefix
        reason: Captures cannot prove personal review or endorsement.
    authority_expectation: Distinguish available source material from personally reviewed or accepted arguments.
    freshness_expectation: Resource availability is historical evidence; review status requires an explicit dated record.
    expected_unknowns:
      - Which resources were reviewed.
      - Which arguments were accepted, rejected, or left open.

  - question_id: CTX-FAI-003
    required_sources:
      - ref: wiki/areas/personal-identity/theology.md
        kind: exact-path
        reason: Canonical personal theology states settled convictions about Scripture.
    acceptable_alternatives:
      - ref: faith/theology/
        kind: path-prefix
        reason: Reviewed doctrinal synthesis may add studied positions without overriding personal authority.
      - ref: faith/resources/theology/
        kind: path-prefix
        reason: Exploratory resources may evidence study but not conclusions.
    forbidden_sources:
      - ref: history/
        kind: path-prefix
        reason: Historical notes cannot establish current theological conclusions.
    authority_expectation: Separate settled personal conviction, reviewed synthesis, and merely studied alternatives.
    freshness_expectation: Core conviction is durable; studied-position claims require provenance and review status.
    expected_unknowns:
      - Which alternative positions were studied in depth.
      - Whether any reviewed synthesis exists beyond the canonical personal statement.

  - question_id: CTX-FAI-004
    required_sources:
      - ref: missing:current-bible-study-reading-register
        kind: intentionally-missing
        reason: No verified current register lists active Bible study resources or commentary series.
    acceptable_alternatives:
      - ref: faith/studies/
        kind: path-prefix
        reason: Prepared studies may indicate active work when dated and reviewed.
      - ref: faith/resources/bible/
        kind: path-prefix
        reason: Bible resources show available material but not current reading status.
    forbidden_sources:
      - ref: history/
        kind: path-prefix
        reason: Historical study artifacts cannot establish what is currently being worked through.
    authority_expectation: Require an explicit current study register; do not infer active reading from file presence.
    freshness_expectation: Active-study status is high-freshness and needs a recent review date.
    expected_unknowns:
      - Current titles, sequence, progress, and intended outcomes.

  - question_id: CTX-FAI-005
    required_sources:
      - ref: faith/questions/
        kind: path-prefix
        reason: Canonical location for unresolved and actively investigated faith questions.
    acceptable_alternatives:
      - ref: faith/resources/theology/
        kind: path-prefix
        reason: Exploratory research may support an open question without resolving it.
    forbidden_sources:
      - ref: faith/theology/
        kind: path-prefix
        reason: Settled synthesis must not be misrepresented as an unresolved question unless it explicitly records one.
    authority_expectation: The open-question register governs unresolved status; absence of entries means insufficient evidence, not no questions.
    freshness_expectation: Open-question status requires current review because questions may be resolved or reframed.
    expected_unknowns:
      - Whether the currently empty structural folder reflects no open questions or missing migration.

  - question_id: CTX-PRJ-001
    required_sources:
      - ref: missing:projects/synthetic-project/current-status
        kind: intentionally-missing
        reason: The synthetic project has no production status source by design.
    acceptable_alternatives:
      - ref: projects/README.md
        kind: exact-path
        reason: Project policy defines where active project state should live but contains no synthetic project facts.
    forbidden_sources:
      - ref: projects/prochat-qa-memory/
        kind: path-prefix
        reason: A real unrelated project must not be substituted for the synthetic project.
    authority_expectation: Return insufficient evidence; never map a synthetic ID to a real project.
    freshness_expectation: Project status requires a current dated status record.
    expected_unknowns:
      - Status, blockers, owner, and last update for the synthetic project.

  - question_id: CTX-PRJ-002
    required_sources:
      - ref: missing:projects/synthetic-project/decisions
        kind: intentionally-missing
        reason: No production decision record exists for the synthetic project.
    acceptable_alternatives:
      - ref: projects/README.md
        kind: exact-path
        reason: Project policy supplies placement rules only.
    forbidden_sources:
      - ref: knowledge/decisions.md
        kind: exact-path
        reason: Global decisions must not be assumed to belong to the synthetic project.
    authority_expectation: Only project-scoped or explicit human decisions may establish scope and approach.
    freshness_expectation: Decisions remain current until superseded, but none exist for this fixture.
    expected_unknowns:
      - Approved scope, approach, decision dates, and supersession state.

  - question_id: CTX-PRJ-003
    required_sources:
      - ref: missing:projects/synthetic-project/risks
        kind: intentionally-missing
        reason: No production risk or open-question register exists for the synthetic project.
    acceptable_alternatives: []
    forbidden_sources:
      - ref: system/reports/
        kind: path-prefix
        reason: Unrelated generated reports cannot supply synthetic project risks.
    authority_expectation: Return insufficient evidence rather than extrapolating risks from other projects.
    freshness_expectation: Open risks require recent review and explicit status.
    expected_unknowns:
      - Current risks, owners, severity, mitigations, and unresolved questions.

  - question_id: CTX-PRJ-004
    required_sources:
      - ref: missing:projects/synthetic-project/onboarding
        kind: intentionally-missing
        reason: No production onboarding source exists for the synthetic project.
    acceptable_alternatives:
      - ref: projects/README.md
        kind: exact-path
        reason: Project policy provides general linking expectations only.
    forbidden_sources:
